<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 1240" width="1240" height="1240">
  <defs>
    <!-- Background tile -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A4C"/>
      <stop offset="0.35" stop-color="#FF4A17"/>
      <stop offset="0.75" stop-color="#E5250C"/>
      <stop offset="1" stop-color="#F0461A"/>
    </linearGradient>
    <radialGradient id="bgShade" cx="0.62" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#C80F00" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C80F00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Bone shapes -->
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FCEDE8"/>
      <stop offset="1" stop-color="#F6B9A4"/>
    </linearGradient>
    <linearGradient id="boneEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.6" stop-color="#F4A88E" stop-opacity="0"/>
      <stop offset="1" stop-color="#F4A88E" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dx="14" dy="24"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feFlood flood-color="#A10A00"/>
      <feComposite operator="in" in2="SourceGraphic"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>

    <path id="b" d="M450 258
      C540 258 610 320 610 410
      L610 840
      C610 930 540 992 455 992
      C360 992 285 935 285 860
      C285 790 330 742 346 714
      C365 680 375 652 375 620
      C375 582 360 548 340 512
      C320 476 295 442 295 386
      C295 312 365 258 450 258 Z"/>

    <!-- Right bone: mirrored coordinates so lighting stays top-left -->
    <path id="b2" d="M801 258
      C711 258 641 320 641 410
      L641 840
      C641 930 711 992 796 992
      C891 992 966 935 966 860
      C966 790 921 742 905 714
      C886 680 876 652 876 620
      C876 582 891 548 911 512
      C931 476 956 442 956 386
      C956 312 886 258 801 258 Z"/>
  </defs>

  <!-- Tile -->
  <rect x="50" y="45" width="1150" height="1150" rx="250" fill="url(#bg)"/>
  <rect x="50" y="45" width="1150" height="1150" rx="250" fill="url(#bgShade)"/>
  <rect x="58" y="53" width="1134" height="1134" rx="244" fill="none"
        stroke="url(#rim)" stroke-width="16"/>

  <!-- Bones -->
  <g filter="url(#shadow)">
    <use href="#b" xlink:href="#b" fill="url(#bone)"/>
    <use href="#b2" xlink:href="#b2" fill="url(#bone)"/>
  </g>
  <use href="#b" xlink:href="#b" fill="url(#boneEdge)"/>
  <use href="#b2" xlink:href="#b2" fill="url(#boneEdge)"/>

  <!-- Gloss highlights -->
  <path d="M335 380 C335 320 385 290 430 290 C395 305 360 340 352 395 Z"
        fill="url(#gloss)" filter="url(#soft)"/>
  <path d="M672 400 C672 340 702 302 742 290 C712 312 692 352 686 405 Z"
        fill="url(#gloss)" filter="url(#soft)"/>
  <path d="M318 640 C335 690 330 760 305 830 C320 770 325 700 318 640 Z"
        fill="#FFFFFF" opacity="0.7" filter="url(#soft)"/>
</svg>
